name: Deploy MarketLens to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: marketlens-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install research dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check research and data-isolation tests
        run: python -m pytest backend/tests -q
      - name: Export isolated synthetic fixtures
        run: python scripts/export_pages.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build for the project URL
        working-directory: frontend
        env:
          VITE_SNAPSHOT_REPOSITORY: ${{ github.repository }}
          VITE_SNAPSHOT_BRANCH: research-data
        run: npm run build:pages
      - name: Check immutable published-snapshot reader
        working-directory: frontend
        run: node scripts/test-publication.mjs
      - name: Verify Pages artifact paths and fixture isolation
        working-directory: frontend
        run: node scripts/check-pages.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
