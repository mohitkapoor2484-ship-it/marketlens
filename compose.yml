services:
  marketlens:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/marketlens.db
    volumes:
      - marketlens-data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
volumes:
  marketlens-data:
